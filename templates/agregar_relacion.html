{% extends "base.html" %}
{% block title %}Agregar relación CI{% endblock %}
{% block content %}
<h4 class="mb-3">Relacionar activo con otro CI</h4>
<form method="POST" action="/agregar_relacion">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="activo_id">Activo origen</label>
      <select class="form-control" name="activo_id" required>
        {% for activo in activos %}
          <option value="{{ activo.id }}">{{ activo.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label for="ci_relacionado_id">CI relacionado</label>
      <select class="form-control" name="ci_relacionado_id" required>
        {% for ci in cis %}
          <option value="{{ ci.id }}">{{ ci.nombre }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label for="tipo_relacion">Tipo de relación</label>
      <select class="form-control" name="tipo_relacion" required>
        <option value="Depende de">Depende de</option>
        <option value="Soporta a">Soporta a</option>
        <option value="Relacionado con">Relacionado con</option>
      </select>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Guardar relación</button>
</form>
{% endblock %}
