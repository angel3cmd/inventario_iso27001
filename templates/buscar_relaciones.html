{% extends "base.html" %}
{% block title %}Buscar Relaciones{% endblock %}

{% block content %}
<h2>{{ t['buscar_relaciones'] }}</h2>

<input type="text" id="query" placeholder="Buscar por nombre o tipo de relación" oninput="buscarRelaciones()" style="width: 300px; padding: 5px;">
<br><br>

<table border="1" id="resultados" style="width: 100%; border-collapse: collapse;">
  <thead>
    <tr>
      <th>Origen</th>
      <th>Destino</th>
      <th>Tipo</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
function buscarRelaciones() {
  const query = document.getElementById("query").value;
  fetch(`/buscar_relaciones?query=${encodeURIComponent(query)}`)
    .then(response => response.json())
    .then(data => {
      const tbody = document.querySelector("#resultados tbody");
      tbody.innerHTML = "";
      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.origen_nombre}</td><td>${row.destino_nombre}</td><td>${row.tipo}</td>`;
        tbody.appendChild(tr);
      });
    });
}
</script>
{% endblock %}
