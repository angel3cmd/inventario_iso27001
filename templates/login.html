{% extends "base_simple.html" %}
{% block title %}{{ t['login_title'] }}{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 400px;">
  <div class="card-header bg-dark text-white text-center">{{ t['login_header'] }}</div>
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label>{{ t['username'] }}:</label>
        <input name="usuario" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>{{ t['password'] }}:</label>
        <input name="clave" type="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">{{ t['login_button'] }}</button>
    </form>
  </div>
</div>
{% endblock %}
