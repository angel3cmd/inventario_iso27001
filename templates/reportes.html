{% extends "base.html" %}
{% block title %}{{ t['reportes'] }}{% endblock %}

{% block content %}
<h2>{{ t['reportes'] }}</h2>
<table>
  <thead>
    <tr>
      <th>{{ t['nombre'] }}</th>
      <th>{{ t['fecha'] }}</th>
      <th>{{ t['tipo'] }}</th>
    </tr>
  </thead>
  <tbody>
    {% for item in reportes %}
    <tr>
      <td>{{ item['nombre'] }}</td>
      <td>{{ item['fecha'] }}</td>
      <td>{{ item['tipo'] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
