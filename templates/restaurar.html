{% extends "base.html" %}
{% block title %}{{ t['restore_title'] }}{% endblock %}
{% block content %}
<h4 class="mb-3">{{ t['restore_title'] }}</h4>
<div class="card">
  <div class="card-body">
    <ul class="list-group">
      {% for archivo in archivos %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          {{ archivo }}
          <a href="/restaurar/{{ archivo }}" class="btn btn-sm btn-outline-primary">{{ t['restore_button'] }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
